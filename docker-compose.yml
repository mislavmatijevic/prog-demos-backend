services:
    database:
        restart: unless-stopped
        build:
            context: .
            dockerfile: ./Docker/db.Dockerfile
        container_name: database
        environment:
            POSTGRES_USER: ${DB_USER}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            POSTGRES_DB: prog_demos
        volumes:
            - db_data:/var/lib/postgresql/data
        networks:
            - backend-network
        healthcheck:
            test: "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
            interval: 2s
            timeout: 5s
            retries: 5

    backend:
        restart: unless-stopped
        build:
            context: .
            dockerfile: ./Docker/app.Dockerfile
        container_name: backend
        depends_on:
            database:
                condition: service_healthy
        environment:
            DB_HOST: database
            DB_USER: ${DB_USER}
            DB_PASSWORD: ${DB_PASSWORD}
            DB_NAME: prog_demos
            PORT: 8080
            TASK_RUNNER_MOUNT_NAME: prog-demos-backend_tasks
            PROD: ${IS_PROD}
            USE_LOKI: ${IS_PROD}
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
            - tasks:${TASK_RUNNER_TEMP_TASKS_DIRECTORY}
        ports:
            - "127.0.0.1:8080:8080"
        networks:
            - backend-network
    pgadmin:
        restart: unless-stopped
        image: dpage/pgadmin4
        container_name: pgadmin4_container
        environment:
            POSTGRES_USER: ${DB_USER}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
            PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
            PGADMIN_CONFIG_WTF_CSRF_ENABLED: "False"
        volumes:
            - pgadmin:/var/lib/pgadmin
        ports:
            - "8888:80"
        networks:
            - backend-network

    caddy:
        restart: unless-stopped
        build:
            context: .
            dockerfile: ./Docker/caddy.Dockerfile
        container_name: tasks-repository
        ports:
            - "8889:8889"
        volumes:
            - ./Docker/Caddyfile:/etc/caddy/Caddyfile
            - ${TASKS_REPOSITORY_LOCATION}:/srv/files

volumes:
    db_data:
    tasks:
    pgadmin:

networks:
    backend-network:
        driver: bridge
